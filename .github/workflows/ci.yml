name: 🧪 CI Quality Gate & Automated Tests

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-gate:
    name: 🛡️ Quality Gate & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. Weryfikacja obecności pliku wejściowego index.php
        run: |
          if [ ! -f index.php ]; then
            echo "❌ Brak pliku wejściowego index.php!"
            exit 1
          fi

      - name: 3. Ochrona przed wyciekiem plików sekretów (.env, secrets.php) i skan Gitleaks
        run: |
          if git ls-files | grep -E "(\.env$|config/secrets\.php|\.htpasswd|leady\.csv)$"; then
            echo "❌ Wykryto plik z wrażliwymi danymi w repozytorium!"
            exit 1
          fi
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --verbose --redact

      - name: 4. Konfiguracja środowiska PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, fileinfo, json, mbstring, curl

      - name: 5. Weryfikacja składni PHP (PHP Lint na wszystkich plikach)
        run: php tests/lint_php.php

      - name: 6. Konfiguracja środowiska Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 7. Weryfikacja poprawności składniowej JavaScript
        run: npm run check:syntax

      - name: 8. Uruchomienie testów jednostkowych PHP Backend
        run: npm run test:php

      - name: 9. Uruchomienie testów jednostkowych Node.js & Raport pokrycia (Coverage)
        run: npm run test:coverage

  lighthouse:
    name: 🚦 Audyt Lighthouse CI (a11y, SEO, Best Practices)
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: 1. Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. Konfiguracja środowiska Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 3. Audyt jakościowy Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'
