name: 🚀 Deploy STAGING

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    name: 🧪 Run CI checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, fileinfo, json, mbstring, curl

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🛡️ Full Quality Gate (PHP Lint + Syntax + Unit Tests)
        run: npm run check

  deploy:
    name: 🌐 Deploy → test.raricart.pl
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Generate config/secrets.php from GitHub Secret
        env:
          CF_SECRETS_PHP: ${{ secrets.CF_SECRETS_PHP }}
        run: |
          if [ -n "$CF_SECRETS_PHP" ]; then
            mkdir -p config
            printf '%s\n' "$CF_SECRETS_PHP" > config/secrets.php
            chmod 600 config/secrets.php
          fi

      - name: 🚀 Upload staging files
        uses: appleboy/scp-action@master
        with:
          host: serwer409986.lh.pl
          username: serwer409986
          password: ${{ secrets.FTP_PASSWORD }}
          port: 40022
          source: >
            **,
            !.git/**,
            !.github/**,
            !.gemini/**,
            !tests/**,
            !drafts/**,
            !testpkg/**,
            !assets/data/config.json,
            !assets/data/*.dist,
            !assets/gallery/**,
            !assets/images/parallax/**,
            !assets/uploads/**,
            !*.bak,
            !api/sessions/**,
            !api/rate_limits/**,
            !api/leads_*.csv,
            !*.md
          target: '/home/platne/serwer409986/public_html/test.raricart.pl/'
          overwrite: true
