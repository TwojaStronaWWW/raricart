name: 🚀 Deploy PRODUCTION

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: 🧪 Run CI checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, fileinfo, json, mbstring, curl

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🛡️ Full Quality Gate (PHP Lint + Syntax + Unit Tests)
        run: npm run check

  deploy:
    name: 🌐 Deploy → raricart.pl
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔐 Generate config/secrets.php from GitHub Secret
        env:
          CF_SECRETS_PHP: ${{ secrets.CF_SECRETS_PHP }}
        run: |
          if [ -n "$CF_SECRETS_PHP" ]; then
            mkdir -p config
            printf '%s\n' "$CF_SECRETS_PHP" > config/secrets.php
            chmod 600 config/secrets.php
          fi

      - name: 🛡️ Restore live CMS state (content.json & gallery.json) from Cloudflare R2
        run: |
          php -r '
            require "config/config.php";
            require "api/R2Client.php";
            if (defined("R2_ACCOUNT_ID") && defined("R2_ACCESS_KEY_ID") && defined("R2_SECRET_ACCESS_KEY") && defined("R2_BUCKET_NAME")) {
              $r2 = new \Raricart\Api\R2Client(R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME);
              foreach (["content.json", "gallery.json"] as $f) {
                $body = $r2->getObject("system/" . $f);
                if (is_string($body) && strlen($body) > 10 && json_decode($body, true) !== null) {
                  file_put_contents("assets/data/" . $f, $body);
                  echo "Restored assets/data/{$f} from Cloudflare R2 (" . strlen($body) . " bytes)\n";
                }
              }
            }
          ' || true

      - name: 🚀 Upload production files
        uses: appleboy/scp-action@master
        with:
          host: serwer409986.lh.pl
          username: serwer409986
          password: ${{ secrets.FTP_PASSWORD }}
          port: 40022
          source: >
            **,
            !.git/**,
            !.github/**,
            !.gemini/**,
            !.githooks/**,
            !.gitleaks.toml,
            !.npmrc,
            !.env*,
            !tests/**,
            !scripts/**,
            !docs/audits/**,
            !drafts/**,
            !testpkg/**,
            !assets/data/config.json,
            !assets/data/login_attempts.json,
            !assets/data/reset_tokens.json,
            !assets/data/*.dist,
            !assets/gallery/**,
            !assets/images/parallax/**,
            !assets/uploads/**,
            !*.bak*,
            !*.pem,
            !*.key,
            !*.kdbx,
            !api/sessions/**,
            !api/rate_limits/**,
            !api/drafts/**,
            !api/leads_*.csv,
            !admin/leady.csv,
            !bin/**,
            !docker/**,
            !*.md
          target: '/home/platne/serwer409986/public_html/raricart.pl/'
          overwrite: true

      - name: 🏷️ Automatyczne tagowanie wydania produkcyjnego (Git Release Tag)
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
