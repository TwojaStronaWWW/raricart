name: 🚀 Deploy PRODUCTION

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: 🧪 Run CI checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🔍 PHP Lint
        run: |
          find . -type f -name "*.php" \
          -not -path "./vendor/*" \
          -not -path "./tests/*" \
          -print0 | xargs -0 -n1 php -l

  deploy:
    name: 🌐 Deploy → raricart.pl
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🔐 Generate config/secrets.php from GitHub Secret
        if: ${{ env.CF_SECRETS_PHP != '' }}
        env:
          CF_SECRETS_PHP: ${{ secrets.CF_SECRETS_PHP }}
        run: |
          mkdir -p config
          cat << 'EOF' > config/secrets.php
          ${{ secrets.CF_SECRETS_PHP }}
          EOF
          chmod 600 config/secrets.php

      - name: 🚀 Upload production files
        uses: appleboy/scp-action@master
        with:
          host: serwer409986.lh.pl
          username: serwer409986
          password: ${{ secrets.FTP_PASSWORD }}
          port: 40022
          source: >
            **,
            !.git/**,
            !.github/**,
            !tests/**,
            !drafts/**,
            !testpkg/**,
            !assets/data/**,
            !assets/gallery/**,
            !assets/images/parallax/**,
            !assets/uploads/**,
            !*.md
          target: '/home/platne/serwer409986/public_html/raricart.pl/'
          overwrite: true
